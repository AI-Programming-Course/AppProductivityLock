# Generate the Xcode project with:  xcodegen generate
# Before generating, replace "com.example.focuslock" everywhere (here and in
# Shared/SharedStore.swift) with your own reverse-DNS prefix, and set DEVELOPMENT_TEAM.
name: FocusLock
options:
  bundleIdPrefix: com.example.focuslock
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    DEVELOPMENT_TEAM: ""
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"

targets:
  FocusLock:
    type: application
    platform: iOS
    sources: [FocusLock, Shared]
    info:
      path: FocusLock/Info.plist
      properties:
        CFBundleDisplayName: FocusLock
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    entitlements:
      path: FocusLock/FocusLock.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [group.com.example.focuslock]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.focuslock
    dependencies:
      - target: ActivityMonitor
      - target: ShieldConfig

  # Runs in the background; iOS wakes it when the daily limit is reached.
  ActivityMonitor:
    type: app-extension
    platform: iOS
    sources: [ActivityMonitor, Shared]
    info:
      path: ActivityMonitor/Info.plist
      properties:
        CFBundleDisplayName: ActivityMonitor
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).DeviceActivityMonitorExtension
    entitlements:
      path: ActivityMonitor/ActivityMonitor.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [group.com.example.focuslock]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.focuslock.ActivityMonitor

  # Draws the screen you see when opening a blocked app.
  ShieldConfig:
    type: app-extension
    platform: iOS
    sources: [ShieldConfig]
    info:
      path: ShieldConfig/Info.plist
      properties:
        CFBundleDisplayName: ShieldConfig
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettingsUI.shield-configuration-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldConfigurationExtension
    entitlements:
      path: ShieldConfig/ShieldConfig.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [group.com.example.focuslock]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.focuslock.ShieldConfig
