# Generate the Xcode project with:  xcodegen generate
# Before generating, set the two values below. Everything else (bundle IDs, the
# App Group, the entitlements) is derived from them.
# Make all changes here, not in Xcode: Info.plist and entitlements are regenerated.
name: FocusLock
options:
  deploymentTarget:
    iOS: "17.4"
settings:
  base:
    BUNDLE_PREFIX: com.example.focuslock   # <- your own reverse-DNS ID
    DEVELOPMENT_TEAM: ""                   # <- your Apple Team ID
    APP_GROUP_ID: group.$(BUNDLE_PREFIX)
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"

targets:
  FocusLock:
    type: application
    platform: iOS
    sources: [FocusLock, Shared]
    info:
      path: FocusLock/Info.plist
      properties:
        CFBundleDisplayName: FocusLock
        AppGroupID: $(APP_GROUP_ID)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    entitlements:
      path: FocusLock/FocusLock.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [$(APP_GROUP_ID)]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX)
    dependencies:
      - target: ActivityMonitor
      - target: ShieldConfig

  # Runs in the background; iOS wakes it when the daily limit is reached.
  ActivityMonitor:
    type: app-extension
    platform: iOS
    sources: [ActivityMonitor, Shared]
    info:
      path: ActivityMonitor/Info.plist
      properties:
        CFBundleDisplayName: ActivityMonitor
        AppGroupID: $(APP_GROUP_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).DeviceActivityMonitorExtension
    entitlements:
      path: ActivityMonitor/ActivityMonitor.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [$(APP_GROUP_ID)]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).ActivityMonitor

  # Draws the screen you see when opening a blocked app.
  ShieldConfig:
    type: app-extension
    platform: iOS
    sources: [ShieldConfig]
    info:
      path: ShieldConfig/Info.plist
      properties:
        CFBundleDisplayName: ShieldConfig
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettingsUI.shield-configuration-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldConfigurationExtension
    entitlements:
      path: ShieldConfig/ShieldConfig.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [$(APP_GROUP_ID)]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).ShieldConfig
